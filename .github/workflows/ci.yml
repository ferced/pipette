name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q ingest
      - name: Unit tests
        working-directory: ingest
        run: python -m unittest discover -s tests -v

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      DATA_URL: https://pipette-day-data.s3.us-east-1.amazonaws.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Taxonomy is in sync
        run: diff ../shared/taxonomy.json lib/taxonomy.json
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit
      - name: Build
        run: npm run build
